metadata:
  name: pth-facebookresearch-sam-vit-h
  namespace: cvat
  annotations:
    name: Segment Anything
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    animated_gif: https://raw.githubusercontent.com/cvat-ai/cvat/develop/site/content/en/images/hrnet_example.gif
    help_message: The interactor allows to get a mask of an object using at least one positive, and any negative points inside it

spec:
  description: Interactive object segmentation with Segment-Anything
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam

spec:
  runtime: python:3.10
  handler: main:handler
  env:
    - name: SAM2_CONFIG
      value: /opt/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    - name: SAM2_CHECKPOINT
      value: /opt/nuclio/sam2.1_hiera_large.pt
    - name: PYTHONPATH
      value: /opt/sam2
  build:
    baseImage: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install -y python3-pip git curl && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: python3 -m pip install --upgrade pip
        # Match your CUDA (12.1 here) — adjust if needed
        - kind: RUN
          value: pip install "torch>=2.5.1" "torchvision>=0.20.1" --index-url https://download.pytorch.org/whl/cu121
        - kind: RUN
          value: pip install numpy pillow opencv-python-headless
        - kind: RUN
          value: git clone https://github.com/facebookresearch/sam2.git /opt/sam2 && pip install -e /opt/sam2
        - kind: RUN
          value: curl -L https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt -o /opt/nuclio/sam2.1_hiera_large.pt
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB
  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
