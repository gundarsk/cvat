# serverless/pytorch/facebookresearch/sam2/nuclio/function.yaml
metaVersion: v1
kind: function
metadata:
  name: sam2_interactor
  namespace: nuclio
  annotations:
    # human-friendly name shown in UI - MUST be a string
    name: "Segment Anything 2 (Hiera-L)"
    # keep version as string
    version: "2"
    # function type used by CVAT - string
    type: "interactor"
    # minimal point prompts required (strings)
    min_pos_points: "0"
    min_neg_points: "0"
    # allow starting with a box prompt (string-encoded boolean)
    startswith_box_optional: "true"
    # short help message for CVAT
    help_message: "SAM2 (Hiera-L) interactor: provide point prompts or a box; zero positive points allowed (box-only is accepted)."
    # An example GIF or documentation URL (string)
    animated_gif: "https://raw.githubusercontent.com/facebookresearch/sam2/main/assets/demo.gif"
    # `spec` must be a string; here we embed JSON as a string (multiline block is fine)
    spec: |
      {"min_pos_points":0,"min_neg_points":0,"startswith_box_optional":true}
labels:
  nuclio.io/project-name: cvat

spec:
  # Base image for building the function container (CUDA runtime for GPU)
  build:
    baseImage: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
    # Pre-copy/build directives - executed during image build
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: apt-get update && apt-get install -y python3-pip git curl && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: python3 -m pip install --upgrade pip
        - kind: WORKDIR
          value: /opt/nuclio
        # create weights dir
        - kind: RUN
          value: mkdir -p /opt/nuclio/weights
        # download the Hiera-L checkpoint during build (replace URL if upstream changes)
        - kind: RUN
          value: curl -L -o /opt/nuclio/weights/sam2.1_hiera_large.pt https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt
          # install PyTorch (CUDA 12.1) and torchvision from PyTorch index; adjust versions if needed
        - kind: RUN
          value: pip install "torch>=2.5.1" "torchvision>=0.20.1" --index-url https://download.pytorch.org/whl/cu121
        - kind: RUN
          value: pip install numpy pillow opencv-python-headless
        # fetch sam2 code and make it available in container
        - kind: RUN
          value: git clone https://github.com/facebookresearch/sam2.git /opt/sam2 && pip install -e /opt/sam2
  disableDefaultHTTPTrigger: false

  # environment variables used by the handler
  env:
    - name: SAM2_CONFIG
      value: /opt/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    - name: SAM2_CHECKPOINT
      value: /opt/nuclio/weights/sam2.1_hiera_large.pt
    - name: PYTHONPATH
      value: /opt/sam2

  # function handler (module:function)
  handler: main:handler
  # runtime
  runtime: python:3.10

  # expose as an HTTP trigger so CVAT can call it
  triggers:
    http:
      class: ""
      kind: http
      name: http
      attributes:
        maxRequestBodySize: 33554432
      numWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000

  # resource requests/limits - request a GPU; memory request set high for model load
  resources:
    limits:
      nvidia.com/gpu: "1"
    requests:
      cpu: 250m
      memory: 8Gi

  readinessTimeoutSeconds: 300
  eventTimeout: ""
  platform: {}
