metadata:
  name: sam2-interactor
  namespace: nuclio
  labels:
    nuclio.io/project-name: cvat
  annotations:
    name: "Segment Anything 2 (Interactor)"
    type: "interactor"
    version: "2"
    # CVAT reads this JSON string; annotation values must be strings (Nuclio requirement).
    # min_* says how many clicks are required; box optional allows clicks-only flow.
    spec: '{"min_pos_points": 0, "min_neg_points": 0, "startswith_box_optional": true}'

spec:
  runtime: python:3.10
  handler: main:handler

  env:
    - name: SAM2_CONFIG
      value: /opt/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    - name: SAM2_CHECKPOINT
      value: /opt/nuclio/weights/sam2.1_hiera_large.pt
    - name: PYTHONPATH
      value: /opt/sam2

  build:
    baseImage: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        - kind: WORKDIR
          value: /opt/nuclio/weights
        - kind: RUN
          value: curl -L -o /opt/nuclio/weights/sam2.1_hiera_large.pt https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt
        - kind: RUN
          value: apt-get update && apt-get install -y python3-pip git build-essential python3-dev && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: ln -sf /usr/bin/python3 /usr/bin/python
        - kind: RUN
          value: python3 -m pip install --upgrade pip
        # Torch + torchvision for CUDA 12.1 (adjust cu version if needed)
        - kind: RUN
          value: pip install --no-cache-dir "torch>=2.5.1" "torchvision>=0.20.1" --index-url https://download.pytorch.org/whl/cu121
        - kind: RUN
          value: pip install --no-cache-dir numpy pillow opencv-python-headless pycocotools
        - kind: RUN
          value: git clone https://github.com/facebookresearch/sam2.git /opt/sam2 && pip install -e /opt/sam2

  triggers:
    http:
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  resources:
    limits:
      nvidia.com/gpu: 1
